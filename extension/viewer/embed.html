<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aether 3D ISL Embedded Viewer</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 35%, rgba(30, 41, 59, 0.92), rgba(11, 15, 23, 0.98));
      font-family: system-ui, -apple-system, sans-serif;
      color: #e6edf3;
    }
    #viewer-root {
      position: relative;
      width: 100%;
      height: 100%;
    }
    #viewer-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
    #embed-status {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-size: 12px;
      color: #9fb1c8;
      background: rgba(11, 15, 23, 0.85);
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    #embed-status.hidden {
      opacity: 0;
      display: none;
    }
    #embed-hud {
      position: absolute;
      left: 8px;
      bottom: 8px;
      padding: 3px 8px;
      border-radius: 6px;
      background: rgba(13, 17, 23, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-size: 10px;
      color: #8b949e;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="viewer-root">
    <canvas id="viewer-canvas"></canvas>
    <div id="embed-status">Initializing 3D Aether Rig...</div>
    <div id="embed-hud">Aether Ready</div>
  </div>
  <script type="module" src="./embed.js"></script>
</body>
</html>
